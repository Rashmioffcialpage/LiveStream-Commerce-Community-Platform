name: Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - run: npm ci

    - name: Typecheck
      run: npx tsc --noEmit

    - name: Build
      run: npm run build
      env:
        # dummy values -- this job only proves the app compiles and every
        # page renders/prerenders without a live backend, not that the
        # backends are reachable
        NEXT_PUBLIC_AUTH_URL: http://localhost:8080
        NEXT_PUBLIC_STREAM_URL: http://localhost:8081
        NEXT_PUBLIC_CHAT_URL: http://localhost:8082
