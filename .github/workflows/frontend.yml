name: Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - run: npm ci

    # next build runs its own TypeScript check as part of the build (it
    # needs to anyway, to generate the ambient route types like
    # LayoutProps that a standalone `tsc --noEmit` can't see until a build
    # has run at least once) -- no separate typecheck step needed.
    - name: Build
      run: npm run build
      env:
        # dummy values -- this job only proves the app compiles and every
        # page renders/prerenders without a live backend, not that the
        # backends are reachable
        NEXT_PUBLIC_AUTH_URL: http://localhost:8080
        NEXT_PUBLIC_STREAM_URL: http://localhost:8081
        NEXT_PUBLIC_CHAT_URL: http://localhost:8082
