services:
  postgres:
    image: postgres:16-alpine
    container_name: livestream-postgres
    ports:
      # host 5433, not 5432 -- avoids clashing with other local projects
      - "5433:5432"
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://auth:auth@postgres:5432/auth?sslmode=disable
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      PORT: "8080"
      # unset by default -- /oauth/google/* returns 501 until these are set
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/oauth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
