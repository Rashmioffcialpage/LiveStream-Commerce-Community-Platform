services:
  auth-postgres:
    image: postgres:16-alpine
    container_name: livestream-auth-postgres
    ports:
      # host 5433, not 5432 -- avoids clashing with other local projects
      - "5433:5432"
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://auth:auth@auth-postgres:5432/auth?sslmode=disable
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      PORT: "8080"
      # unset by default -- /oauth/google/* returns 501 until these are set
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/oauth/google/callback}
    depends_on:
      auth-postgres:
        condition: service_healthy

  # --- Task 2: stream-service ---
  # own Postgres + Redis, per-service-database like auth-service -- the
  # only thing stream-service shares with auth-service is JWT_SECRET, so
  # it can verify tokens auth-service issued without a shared database.

  stream-postgres:
    image: postgres:16-alpine
    container_name: livestream-stream-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: stream
    volumes:
      - stream_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d stream"]
      interval: 5s
      timeout: 5s
      retries: 10

  stream-redis:
    image: redis:7-alpine
    container_name: livestream-stream-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for stream recordings, standing in for
  # AWS S3 locally -- stream-service talks to it through the real AWS S3
  # SDK (just pointed at a custom endpoint), so swapping in real S3 in
  # production is an env var change, not a code change. See docs/
  # task-recordings.md.
  minio:
    image: minio/minio:latest
    container_name: livestream-minio
    ports:
      - "9002:9000" # S3 API
      - "9003:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  stream-service:
    build: ./services/stream-service
    container_name: stream-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://stream:stream@stream-postgres:5432/stream?sslmode=disable
      REDIS_URL: redis://stream-redis:6379/0
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      PORT: "8081"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9002
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: recordings
      S3_REGION: us-east-1
      KAFKA_BROKERS: kafka:9092
    depends_on:
      stream-postgres:
        condition: service_healthy
      stream-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy

  # --- Task 3: chat-service ---
  # adds Kafka to the platform: chat-service publishes to it for durable
  # history (see internal/kafka's doc comment) while live delivery goes
  # over Redis Pub/Sub -- same latency-path/durability-path split as
  # fraud-detection's decision cache vs Postgres.

  kafka:
    image: apache/kafka:3.9.0
    container_name: livestream-kafka
    ports:
      - "9194:9094"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9194
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
    volumes:
      - kafka_data:/var/lib/kafka/data

  chat-postgres:
    image: postgres:16-alpine
    container_name: livestream-chat-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-redis:
    image: redis:7-alpine
    container_name: livestream-chat-redis
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-service:
    build: ./services/chat-service
    container_name: chat-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://chat:chat@chat-postgres:5432/chat?sslmode=disable
      REDIS_URL: redis://chat-redis:6379/0
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      KAFKA_BROKERS: kafka:9092
      STREAM_SERVICE_URL: http://stream-service:8081
      PORT: "8082"
    depends_on:
      chat-postgres:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      stream-service:
        condition: service_started

  # --- Task 4: subscription-service + payment-service ---
  # payment-service is a simulated processor (see internal/handler in that
  # service) -- no real card network, no real money. Its job is providing
  # the same contract a real Stripe integration would (idempotent charges,
  # a durable charges record, a success/decline outcome), so
  # subscription-service's integration against it doesn't change shape
  # when payment-service's internals eventually do.

  payment-postgres:
    image: postgres:16-alpine
    container_name: livestream-payment-postgres
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
      POSTGRES_DB: payment
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://payment:payment@payment-postgres:5432/payment?sslmode=disable
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      PORT: "8084"
    depends_on:
      payment-postgres:
        condition: service_healthy

  subscription-postgres:
    image: postgres:16-alpine
    container_name: livestream-subscription-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: subscription
      POSTGRES_PASSWORD: subscription
      POSTGRES_DB: subscription
    volumes:
      - subscription_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subscription -d subscription"]
      interval: 5s
      timeout: 5s
      retries: 10

  subscription-service:
    build: ./services/subscription-service
    container_name: subscription-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://subscription:subscription@subscription-postgres:5432/subscription?sslmode=disable
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      KAFKA_BROKERS: kafka:9092
      STREAM_SERVICE_URL: http://stream-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8084
      PORT: "8083"
    depends_on:
      subscription-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      stream-service:
        condition: service_started
      payment-service:
        condition: service_started

  # --- Task 5: commerce-service ---
  # wallet (spendable, bought with real money via payment-service) +
  # creator earned balance (accumulated from gifts) + gift transaction
  # history. Same payment-service/stream-service integration pattern as
  # subscription-service.

  commerce-postgres:
    image: postgres:16-alpine
    container_name: livestream-commerce-postgres
    ports:
      - "5438:5432"
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    volumes:
      - commerce_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 10

  commerce-service:
    build: ./services/commerce-service
    container_name: commerce-service
    ports:
      - "8086:8086"
    environment:
      DATABASE_URL: postgres://commerce:commerce@commerce-postgres:5432/commerce?sslmode=disable
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      KAFKA_BROKERS: kafka:9092
      STREAM_SERVICE_URL: http://stream-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8084
      PORT: "8086"
    depends_on:
      commerce-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      stream-service:
        condition: service_started
      payment-service:
        condition: service_started

  # --- Task 6: notification-service ---
  # consumes subscription-events, gift-events, and stream-events (the
  # latter newly produced by stream-service's GoLive) and turns each into
  # a durable notification + a live WebSocket push + a (logged, not
  # actually sent -- see internal/email) email.

  notification-postgres:
    image: postgres:16-alpine
    container_name: livestream-notification-postgres
    ports:
      - "5439:5432"
    environment:
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
      POSTGRES_DB: notification
    volumes:
      - notification_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-redis:
    image: redis:7-alpine
    container_name: livestream-notification-redis
    ports:
      - "6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "8087:8087"
    environment:
      DATABASE_URL: postgres://notification:notification@notification-postgres:5432/notification?sslmode=disable
      REDIS_URL: redis://notification-redis:6379/0
      JWT_SECRET: local-dev-secret-do-not-use-in-prod
      KAFKA_BROKERS: kafka:9092
      AUTH_SERVICE_URL: http://auth-service:8080
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8083
      PORT: "8087"
    depends_on:
      notification-postgres:
        condition: service_healthy
      notification-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-service:
        condition: service_started
      subscription-service:
        condition: service_started

volumes:
  auth_postgres_data:
  stream_postgres_data:
  chat_postgres_data:
  kafka_data:
  minio_data:
  payment_postgres_data:
  subscription_postgres_data:
  commerce_postgres_data:
  notification_postgres_data:
