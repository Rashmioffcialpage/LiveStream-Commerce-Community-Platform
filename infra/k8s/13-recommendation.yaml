# Task 8: recommendation-service. Feature pipeline over Redis sorted sets
# (see docs/task-8-recommendation-service.md) -- no Postgres, Redis is the
# system of record here, not just a cache in front of one.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recommendation-redis
  namespace: livestream
spec:
  serviceName: recommendation-redis
  replicas: 1
  selector:
    matchLabels:
      app: recommendation-redis
  template:
    metadata:
      labels:
        app: recommendation-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-redis
  namespace: livestream
spec:
  clusterIP: None
  selector:
    app: recommendation-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: livestream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: rashmioffcialpage/recommendation-service:latest
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: REDIS_URL
              value: "redis://recommendation-redis:6379/0"
            - name: PORT
              value: "8089"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: livestream
spec:
  selector:
    app: recommendation-service
  ports:
    - name: http
      port: 8089
      targetPort: 8089
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommendation-service
  namespace: livestream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommendation-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
