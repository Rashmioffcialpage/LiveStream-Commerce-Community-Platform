# Task 6: notification-service. Reacts to subscription-events, gift-events,
# and stream-events -- one durable notification + a live WebSocket push +
# a (logged, not sent -- see internal/email) email per event.
apiVersion: v1
kind: Secret
metadata:
  name: notification-postgres-secret
  namespace: livestream
type: Opaque
stringData:
  POSTGRES_USER: notification
  POSTGRES_PASSWORD: notification
  POSTGRES_DB: notification
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notification-postgres
  namespace: livestream
spec:
  serviceName: notification-postgres
  replicas: 1
  selector:
    matchLabels:
      app: notification-postgres
  template:
    metadata:
      labels:
        app: notification-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: notification-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "notification", "-d", "notification"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-postgres
  namespace: livestream
spec:
  clusterIP: None
  selector:
    app: notification-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notification-redis
  namespace: livestream
spec:
  serviceName: notification-redis
  replicas: 1
  selector:
    matchLabels:
      app: notification-redis
  template:
    metadata:
      labels:
        app: notification-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-redis
  namespace: livestream
spec:
  clusterIP: None
  selector:
    app: notification-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: livestream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: rashmioffcialpage/notification-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DATABASE_URL
              value: "postgres://notification:notification@notification-postgres:5432/notification?sslmode=disable"
            - name: REDIS_URL
              value: "redis://notification-redis:6379/0"
            - name: PORT
              value: "8087"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8087
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: livestream
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8087
      targetPort: 8087
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: notification-service
  namespace: livestream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
