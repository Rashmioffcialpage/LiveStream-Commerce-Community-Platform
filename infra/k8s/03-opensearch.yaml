# Single-node, security plugin disabled -- same local-dev posture as
# docker-compose.yml (see search-service's compose comment): nothing
# sensitive in the index, this isn't a stance that would hold for a real
# deployment. On AWS, prefer Amazon OpenSearch Service over self-hosting.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: livestream
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.11.0
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: "single-node"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 1.5Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: livestream
spec:
  clusterIP: None
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
