# Task 3: chat-service. WebSocket connections are long-lived HTTP, so no
# special Service config is needed here -- the ALB Ingress (15-ingress.yaml)
# is where WebSocket upgrade support actually has to be configured.
apiVersion: v1
kind: Secret
metadata:
  name: chat-postgres-secret
  namespace: livestream
type: Opaque
stringData:
  POSTGRES_USER: chat
  POSTGRES_PASSWORD: chat
  POSTGRES_DB: chat
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-postgres
  namespace: livestream
spec:
  serviceName: chat-postgres
  replicas: 1
  selector:
    matchLabels:
      app: chat-postgres
  template:
    metadata:
      labels:
        app: chat-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: chat-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "chat", "-d", "chat"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-postgres
  namespace: livestream
spec:
  clusterIP: None
  selector:
    app: chat-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chat-redis
  namespace: livestream
spec:
  serviceName: chat-redis
  replicas: 1
  selector:
    matchLabels:
      app: chat-redis
  template:
    metadata:
      labels:
        app: chat-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-redis
  namespace: livestream
spec:
  clusterIP: None
  selector:
    app: chat-redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: livestream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      containers:
        - name: chat-service
          image: rashmioffcialpage/chat-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: DATABASE_URL
              value: "postgres://chat:chat@chat-postgres:5432/chat?sslmode=disable"
            - name: REDIS_URL
              value: "redis://chat-redis:6379/0"
            - name: PORT
              value: "8082"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: livestream
spec:
  selector:
    app: chat-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: chat-service
  namespace: livestream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chat-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
