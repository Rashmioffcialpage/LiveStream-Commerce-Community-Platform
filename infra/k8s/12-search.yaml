# Task 7: search-service. Owns no writes of its own -- a pure reactor to
# channel-events/stream-events, keeping one OpenSearch document per channel
# in sync (see docs/task-7-search.md). No Postgres/Redis needed here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: livestream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
        - name: search-service
          image: rashmioffcialpage/search-service:latest
          ports:
            - containerPort: 8088
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: PORT
              value: "8088"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8088
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: livestream
spec:
  selector:
    app: search-service
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: search-service
  namespace: livestream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: search-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
