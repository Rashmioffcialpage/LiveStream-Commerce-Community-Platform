# Task 4: payment-service. A simulated payment processor (idempotent
# charges, durable charge records, success/decline outcomes) standing in
# for a real Stripe integration -- see docs/task-4-subscriptions-payments.md.
# No Kafka dependency: it's called synchronously by subscription-service
# and commerce-service, not event-driven itself.
apiVersion: v1
kind: Secret
metadata:
  name: payment-postgres-secret
  namespace: livestream
type: Opaque
stringData:
  POSTGRES_USER: payment
  POSTGRES_PASSWORD: payment
  POSTGRES_DB: payment
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payment-postgres
  namespace: livestream
spec:
  serviceName: payment-postgres
  replicas: 1
  selector:
    matchLabels:
      app: payment-postgres
  template:
    metadata:
      labels:
        app: payment-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: payment-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "payment", "-d", "payment"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-postgres
  namespace: livestream
spec:
  clusterIP: None
  selector:
    app: payment-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: livestream
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: rashmioffcialpage/payment-service:latest
          ports:
            - containerPort: 8084
          env:
            - name: DATABASE_URL
              value: "postgres://payment:payment@payment-postgres:5432/payment?sslmode=disable"
            - name: PORT
              value: "8084"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: livestream
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-service
  namespace: livestream
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
